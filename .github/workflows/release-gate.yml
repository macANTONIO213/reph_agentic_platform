name: release-gate

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  stabilization-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security and regression gate
        env:
          DJANGO_SECRET_KEY: ci-secret-key
          DJANGO_DEBUG: "True"
        run: |
          python manage.py platform_maturity_report --fail-on-unready
          python manage.py enterprise_success_criteria --fail-on-miss
          python manage.py test controlplane.tests.test_inspection_fixes -v 1
          python manage.py test controlplane.tests.test_platform_maturity controlplane.tests.test_factory controlplane.tests.test_phase_c controlplane.tests.test_phase_e controlplane.tests.test_tool_bindings -v 1
